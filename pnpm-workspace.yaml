# pnpm 10 and later no longer read the `pnpm` field from package.json, so the
# overrides that npm, bun, and yarn take from `overrides`/`resolutions` there
# have to be repeated here. Keep the three lists in step.
overrides:
  react-native-reanimated: 4.5.4
  react-native-worklets: 0.10.4
  shell-quote: ^1.12.0
  source-map-js: ^1.2.2
