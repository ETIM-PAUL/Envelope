[toolchain]
package_manager = "pnpm"
solana_version = "3.1.10"
anchor_version = "1.1.2"

[features]
resolution = true
skip-lint = false

[programs.localnet]
hello_world = "BneHHhN7nSXgjZytQWLsi1TRY7xMz83FxpkKgoCb1n2d"
envelope_vault = "B9urpR9ePgLSGPuXv8QDgEBFWth3hJHzPeJoqde3Nrjk"
envelope_stake = "F4DdZ7ArpYrPGCFnBp8mEtakkwNWWTqDFPirNKqCVwTV"

[provider]
cluster = "localnet"
wallet = "~/.config/solana/id.json"

[scripts]
# The default 5s timeout is enough for Surfpool, but not for the slower validator
# that `anchor test --validator legacy` starts, which warms up on first invoke.
test = "npx vitest run --testTimeout=60000"

[hooks]
